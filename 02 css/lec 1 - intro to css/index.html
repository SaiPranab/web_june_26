<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <!-- Internal Css - Style tag -->
  <style>
    p {
      color: royalblue;
      background-color: lightgrey;
    }
  </style>

  <!-- External Css - link tag -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- Inline CSS -->
  <h1 style="color: red; background-color: lightgray;">Css is Awesome</h1>
  <h1 style="color: red; background-color: lightgrey;">Heading 1</h1>

  <!-- Internal CSS -->
  <p>Java Technocrat</p>
  <p>Rashmi Kanta Das</p>

  <!-- External CSS -->
  <div>Lorem, ipsum dolor.</div>
  <div>Lorem ipsum dolor sit amet.</div>
</body>

</html>
