<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>Try, Catch & Finally</h1>

  <script>
    class AppError extends Error{
      constructor(msg) {
        super(msg)
      }
    }

    try {
      // error generating code
      console.log("Try block is executing:- 1")
      // abc()
      // throw new Error("This is a custom error generation")
      throw new AppError("Custom Error class")
      console.log("Try block is executing:- 2")
    } catch(err) {
      // to handle the error generated inside try block
      console.log("Catch block is executed", err)
    } finally {
      // This block will always be executed regardless of exception genrated or not
      console.log("Finally block is executed")
    }
  </script>
</body>
</html>
