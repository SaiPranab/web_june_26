<!DOCTYPE html>
<html lang="en">

<head>

<body style="font-family: cursive;">
  <h2>Using Promises To Avoid Callback Hell</h2>

  <script>
    function sendEmail() {
      return new Promise((resolve, reject) => {
        const number = Math.round(Math.random() * 11)

        setTimeout(() => {
          if (number > 5) {
            resolve("Email sent successfully :- " + number)
          } else {
            reject("unable to send email :- " + number)
          }
        }, 0)
      })
    }

    // sendEmail()
    //   .then((res) => {
    //     console.log("then called", res)

    //     sendEmail()
    //       .then((res) => {
    //         console.log("then 2 called", res)

    //         sendEmail()
    //           .then((res) => {
    //             console.log("then 3 called", res)
    //           })
    //           .catch((err) => {
    //             console.log("catch 3 called", err)
    //           })
    //       })
    //       .catch((err) => {
    //         console.log("catch 2 called", err)
    //       })
    //   })
    //   .catch((err) => {
    //     console.log("catch called", err)
    //   })

    sendEmail()
      .then((res) => {
        console.log("then 1 called", res)
        return sendEmail()
      })
      .then((res) => {
        console.log("then 2 called", res)
        return sendEmail()
      })
      .then((res) => {
        console.log("then 3 called", res)
        return sendEmail()
      })
      .catch((err) => {
        console.log("catch called", err)
      })
  </script>
</body>

</html>
